# rg55g1: sound setup of the game session (WirePlumber 0.5).
#
# Taken over from the Retroid Pocket Mini (SM8250) as a starting point; the audio
# path here is also a q6 DSP (AudioReach topology) in front of the codecs.
# TO CHECK on the device:
#  - whether S24_LE plays about 48 dB too quiet like on SM8250 (if not, the
#    S16LE rule can go);
#  - whether the hardware volume (aw88166 PCM volume) should be left to
#    WirePlumber or fixed by the UCM with a soft-mixer like on the Mini.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } { node.name = "~alsa_input.*" } ]
    actions = { update-props = { audio.format = "S16LE" } }
  }
]

wireplumber.settings = {
  # initial volume of a new output (cubic scale: 0.7 is about -9 dB)
  device.routes.default-sink-volume = 0.7
}
