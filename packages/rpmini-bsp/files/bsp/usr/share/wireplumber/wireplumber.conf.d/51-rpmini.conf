# rpmini: sound setup of the game session (WirePlumber 0.5).
#
# Hardware gain is fixed: the UCM BootSequence sets the WSA digital gain to
# -6 dB and the WSA881x SpeakerEnableSeq puts the PA at +12 dB, so 100 % is
# +6 dB, the loudest sensible level. Volume is done in software below that
# (soft-mixer); otherwise WirePlumber also drives the PA ("Speakers Volume")
# and the level depends on both.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.*" } ]
    actions = { update-props = { api.alsa.soft-mixer = true } }
  }
  {
    # The q6 DSP front ends accept S24_LE but play it about 48 dB too quiet
    # (24-bit samples taken as left-justified 32-bit?); S16LE plays at full level.
    matches = [ { node.name = "~alsa_output.*" } { node.name = "~alsa_input.*" } ]
    actions = { update-props = { audio.format = "S16LE" } }
  }
]

wireplumber.settings = {
  # initial volume of a new output (cubic scale: 0.7 is about -9 dB)
  device.routes.default-sink-volume = 0.7
}
