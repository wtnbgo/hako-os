# Retroid Pocket SM8250 (5 / Mini / Mini V2 / Flip 2)
# From ROCKNIX alsa-ucm-conf patches (Teguh Sobirin), BSD-3-Clause like alsa-ucm-conf.
# Change: the WSA881x init is shipped as RP-wsa881x-init.conf to avoid clashing with alsa-ucm-conf.
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8250/HiFi-RP.conf"
	Comment "HiFi quality Music."
}

SectionUseCase."HDMI" {
	File "/Qualcomm/sm8250/HDMI-RP.conf"
	Comment "HDMI / DisplayPort Output."
}

# Speaker gain: WSA digital 78 (-6 dB). The WSA881x SpeakerEnableSeq sets the PA to
# +12 dB whenever the speaker is enabled, so the loudest level is +6 dB; PipeWire
# (soft-mixer, see wireplumber.conf.d/51-rpmini.conf) scales below that.
BootSequence [
	cset "name='WSA_RX0 Digital Volume' 78"
	cset "name='WSA_RX1 Digital Volume' 78"
	cset "name='SpkrLeft PA Volume' 0"
	cset "name='SpkrRight PA Volume' 0"
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC2 Volume' 10"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.wsa-init.File "/Qualcomm/sm8250/RP-wsa881x-init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
