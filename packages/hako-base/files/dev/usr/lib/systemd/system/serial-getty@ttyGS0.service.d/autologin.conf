# Development image only: root shell on the USB serial console without a password.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear --keep-baud 115200,57600,38400,9600 %I $TERM
# The autologin root shell is interactive and ignores SIGTERM, so stopping the
# unit waited the full default 90 s on every shutdown ("A stop job is running
# for Serial Getty on ttyGS0"). Nothing on this console needs a clean stop.
TimeoutStopSec=3s
# No terminal reset by systemd: it writes to the tty while holding the lock on
# /dev/console. With no USB host the gadget tty never drains, the write blocks,
# and PID 1 then hangs on the console lock when it resets tty1 for the game
# session (seen after a monitor took over USB-C: the session never restarted
# until something was plugged into USB-C again).
TTYReset=no
TTYVHangup=no
# agetty exits whenever the USB host goes away; do not respawn it in a tight loop
RestartSec=2s
