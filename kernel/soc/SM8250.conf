# Kernel build settings for SM8250 boards (Retroid Pocket Mini, ...). Sourced by build.sh.
ROCKNIX_DEVICE_DIR=projects/ROCKNIX/devices/SM8250
# package / release name: linux-image-$KERNEL_VERSION.0-$LOCALVER
LOCALVER=rpmini
KERNEL_PKGREV=5
TARGET_CPU=cortex-a76.cortex-a55
# firmware built into the kernel image (see firmware-SM8250.list)
FW_LIST=firmware-SM8250.list
WORKDIR=build/kernel
