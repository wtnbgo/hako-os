# Kernel build settings for SM4450 boards (Anbernic RG 55G1; the ROCKNIX tree also
# has the Retroid Pocket Classic). Sourced by build.sh.
ROCKNIX_DEVICE_DIR=projects/ROCKNIX/devices/SM4450
LOCALVER=sm4450
KERNEL_PKGREV=2
TARGET_CPU=cortex-a76.cortex-a55
FW_LIST=firmware-SM4450.list
# board specific blobs (DSP, Wi-Fi controller, GPU zap, amplifier tuning) come from
# ROCKNIX's extra-firmware repository, which ROCKNIX also uses for this SoC
EXTRA_FW_REPO=https://raw.githubusercontent.com/ROCKNIX/extra-firmware
EXTRA_FW_COMMIT=925dfb5efbe5d6c3ca654f81e3e1f367f8492777
WORKDIR=build/kernel-sm4450
